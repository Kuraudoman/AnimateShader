# ==============================================================================
# AnimateShader (星穹幻光) — Anime Fantasy Shader Pack
# Target: Minecraft 26.3 (NeoForge / Fabric) + Iris 1.11.7 & OptiFine Compatible
# ==============================================================================

# --- Vanilla Pipeline Feature Overrides ---
clouds=off
sun=false
moon=false
sky=false
stars=false
vignette=false
underwaterOverlay=false
oldHandLight=false
oldLighting=false
separateAo=false
particles.ordering=after
endFlashShadows=true

# --- Shadow Pass Settings ---
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
shadow.culling=true

# --- Multi-Scale Bloom Buffer Resolutions ---
# Only written by composite1..composite5 (never touched by gbuffers)
size.buffer.colortex5=0.5 0.5
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.25 0.25

# --- Per-Buffer Blend Overrides (Iris matches program name without world*/ prefix) ---
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex3=off
blend.gbuffers_basic.colortex1=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_beaconbeam.colortex3=SRC_ALPHA ONE ZERO ONE
blend.gbuffers_armor_glint.colortex3=SRC_ALPHA ONE ZERO ONE
blend.gbuffers_spidereyes.colortex3=SRC_ALPHA ONE ZERO ONE

# --- Conditional Bloom Pass Enabling ---
program.world0/composite1.enabled=BLOOM_ENABLED
program.world0/composite2.enabled=BLOOM_ENABLED
program.world0/composite3.enabled=BLOOM_ENABLED
program.world0/composite4.enabled=BLOOM_ENABLED
program.world0/composite5.enabled=BLOOM_ENABLED
program.world-1/composite1.enabled=BLOOM_ENABLED
program.world-1/composite2.enabled=BLOOM_ENABLED
program.world-1/composite3.enabled=BLOOM_ENABLED
program.world-1/composite4.enabled=BLOOM_ENABLED
program.world-1/composite5.enabled=BLOOM_ENABLED
program.world1/composite1.enabled=BLOOM_ENABLED
program.world1/composite2.enabled=BLOOM_ENABLED
program.world1/composite3.enabled=BLOOM_ENABLED
program.world1/composite4.enabled=BLOOM_ENABLED
program.world1/composite5.enabled=BLOOM_ENABLED

# --- Quality Profiles ---
profile.PERFORMANCE = shadowMapResolution=1024 shadowDistance=96.0 SHADOW_QUALITY=0 CLOUD_QUALITY=0 !SSAO_ENABLED !WATER_SSR !ANAMORPHIC_STREAK GODRAYS_ENABLED BLOOM_ENABLED FANTASY_AURORA MILKY_WAY WAVING_FOLIAGE
profile.BALANCED = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_QUALITY=1 CLOUD_QUALITY=1 SSAO_ENABLED WATER_SSR ANAMORPHIC_STREAK GODRAYS_ENABLED BLOOM_ENABLED FANTASY_AURORA MILKY_WAY SHOOTING_STARS WAVING_FOLIAGE COLORED_SHADOWS
profile.FANTASY_ULTRA = shadowMapResolution=3072 shadowDistance=160.0 SHADOW_QUALITY=2 CLOUD_QUALITY=2 SSAO_ENABLED WATER_SSR ANAMORPHIC_STREAK GODRAYS_ENABLED BLOOM_ENABLED FANTASY_AURORA MILKY_WAY SHOOTING_STARS WAVING_FOLIAGE COLORED_SHADOWS NIGHT_SHADOWS

# --- Settings Screen Layout ---
screen.columns = 2
screen = <profile> COLOR_PALETTE [LIGHTING] [COLOR] [GLOW_EFFECTS] [SKY_CLOUDS] [WATER_WORLD] [SHADOWS]

screen.LIGHTING.columns = 2
screen.LIGHTING = NIGHT_BRIGHTNESS CAVE_BRIGHTNESS OVERALL_EXPOSURE ANIME_SHADING_STYLE RIM_LIGHT_STRENGTH BLOCKLIGHT_STRENGTH DYNAMIC_HANDLIGHT SSAO_ENABLED FOLIAGE_SSS

screen.COLOR.columns = 2
screen.COLOR = COLOR_PALETTE COLOR_VIBRANCE SHADOW_COLOR_TINT SUNSET_WARMTH TONEMAP_CONTRAST

screen.GLOW_EFFECTS.columns = 2
screen.GLOW_EFFECTS = BLOOM_ENABLED BLOOM_INTENSITY ANAMORPHIC_STREAK GODRAYS_ENABLED GODRAYS_STRENGTH EMISSIVE_GLOW SUN_LENS_FLARE VIGNETTE_STRENGTH

screen.SKY_CLOUDS.columns = 2
screen.SKY_CLOUDS = ANIME_CLOUDS CLOUD_QUALITY FANTASY_AURORA AURORA_STRENGTH MILKY_WAY SHOOTING_STARS ATMOSPHERIC_FOG

screen.WATER_WORLD.columns = 2
screen.WATER_WORLD = WATER_SSR WATER_CAUSTICS WATER_SPARKLES WATER_CLARITY WAVING_FOLIAGE WET_REFLECTIONS

screen.SHADOWS.columns = 2
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_QUALITY COLORED_SHADOWS NIGHT_SHADOWS

# --- Sliders ---
sliders = NIGHT_BRIGHTNESS CAVE_BRIGHTNESS OVERALL_EXPOSURE RIM_LIGHT_STRENGTH BLOCKLIGHT_STRENGTH COLOR_VIBRANCE SHADOW_COLOR_TINT SUNSET_WARMTH TONEMAP_CONTRAST BLOOM_INTENSITY GODRAYS_STRENGTH EMISSIVE_GLOW VIGNETTE_STRENGTH AURORA_STRENGTH ATMOSPHERIC_FOG WATER_CLARITY shadowDistance
